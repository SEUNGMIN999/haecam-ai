<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해캄과 짚신벌레 관찰 도우미 🔬</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@400;700&display=swap');

  :root {
    --green: #2d8a4e;
    --green-light: #e8f5ed;
    --green-mid: #a8d5b5;
    --teal: #1a9e8f;
    --teal-light: #e0f5f3;
    --yellow: #f5c842;
    --yellow-light: #fffbe6;
    --orange: #f07b3f;
    --red-soft: #f87171;
    --bg: #f0f7f2;
    --white: #ffffff;
    --text: #1a2e22;
    --text-mid: #4a6655;
    --text-light: #8aab96;
    --border: #c5e0ce;
    --shadow: 0 4px 20px rgba(45,138,78,0.12);
    --shadow-lg: 0 8px 40px rgba(45,138,78,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 배경 장식 */
  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(45,138,78,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* 헤더 */
  header {
    background: linear-gradient(135deg, var(--green) 0%, var(--teal) 100%);
    padding: 28px 24px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(45,138,78,0.3);
  }

  header::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -80px; right: -40px;
    width: 250px; height: 250px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }

  .header-emoji {
    font-size: 48px;
    display: block;
    margin-bottom: 8px;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  header h1 {
    font-family: 'Gaegu', cursive;
    font-size: 30px;
    font-weight: 700;
    color: white;
    letter-spacing: -0.5px;
    position: relative;
    z-index: 1;
  }

  header p {
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }

  /* 메인 컨테이너 */
  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    position: relative;
    z-index: 1;
  }

  /* API 키 섹션 */
  .api-section {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-mid);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .section-label .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
  }

  .api-input-row {
    display: flex;
    gap: 10px;
  }

  input[type="password"], input[type="text"] {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: var(--bg);
    color: var(--text);
  }

  input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(45,138,78,0.12);
    background: white;
  }

  .btn-save {
    padding: 12px 20px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-save:hover {
    background: #236e3e;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(45,138,78,0.3);
  }

  .api-status {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-light);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .api-status.ok { color: var(--green); }

  /* 업로드 카드 */
  .upload-card {
    background: white;
    border-radius: 24px;
    padding: 28px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    border: 2px dashed var(--green-mid);
    transition: all 0.3s;
  }

  .upload-card.dragover {
    border-color: var(--green);
    background: var(--green-light);
    transform: scale(1.01);
  }

  .upload-zone {
    text-align: center;
    cursor: pointer;
  }

  .upload-icon {
    font-size: 64px;
    display: block;
    margin-bottom: 12px;
    filter: grayscale(0);
    transition: transform 0.3s;
  }

  .upload-card:hover .upload-icon {
    transform: scale(1.1) rotate(-5deg);
  }

  .upload-zone h2 {
    font-family: 'Gaegu', cursive;
    font-size: 24px;
    color: var(--green);
    margin-bottom: 6px;
  }

  .upload-zone p {
    font-size: 14px;
    color: var(--text-mid);
    line-height: 1.6;
  }

  .upload-zone .hint {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-light);
    background: var(--green-light);
    padding: 5px 12px;
    border-radius: 20px;
  }

  input[type="file"] { display: none; }

  /* 미리보기 */
  .preview-area {
    display: none;
    margin-top: 16px;
  }

  .preview-area.show { display: block; }

  .preview-img {
    width: 100%;
    max-height: 320px;
    object-fit: contain;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: var(--bg);
  }

  .preview-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  /* 선택 버튼들 */
  .question-section {
    background: white;
    border-radius: 20px;
    padding: 22px 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
  }

  .question-section h3 {
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .question-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .chip {
    padding: 8px 14px;
    border-radius: 20px;
    border: 2px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-mid);
    font-weight: 500;
  }

  .chip:hover {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-light);
  }

  .chip.selected {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }

  .custom-question {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .custom-question input {
    flex: 1;
    padding: 10px 14px;
    font-size: 13px;
  }

  /* 분석 버튼 */
  .btn-analyze {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--green) 0%, var(--teal) 100%);
    color: white;
    border: none;
    border-radius: 18px;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Gaegu', cursive;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 20px rgba(45,138,78,0.35);
    margin-bottom: 24px;
  }

  .btn-analyze:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(45,138,78,0.45);
  }

  .btn-analyze:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .btn-analyze .btn-icon {
    font-size: 22px;
    transition: transform 0.3s;
  }

  .btn-analyze:hover:not(:disabled) .btn-icon {
    transform: rotate(20deg) scale(1.2);
  }

  /* 로딩 */
  .loading-area {
    display: none;
    text-align: center;
    padding: 40px 20px;
    background: white;
    border-radius: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    border: 1.5px solid var(--border);
  }

  .loading-area.show { display: block; }

  .microscope-anim {
    font-size: 60px;
    display: inline-block;
    animation: wiggle 0.5s ease-in-out infinite alternate;
    margin-bottom: 16px;
  }

  @keyframes wiggle {
    0% { transform: rotate(-8deg) scale(1); }
    100% { transform: rotate(8deg) scale(1.05); }
  }

  .loading-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 14px;
  }

  .loading-dots span {
    width: 10px; height: 10px;
    background: var(--green);
    border-radius: 50%;
    animation: dot-bounce 1.2s ease-in-out infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; background: var(--teal); }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; background: var(--yellow); }

  @keyframes dot-bounce {
    0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
    40% { transform: scale(1.2); opacity: 1; }
  }

  .loading-text {
    font-family: 'Gaegu', cursive;
    font-size: 20px;
    color: var(--green);
  }

  .loading-sub {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 4px;
  }

  /* 결과 영역 */
  .result-area {
    display: none;
    animation: fadeUp 0.5s ease-out;
  }

  .result-area.show { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 칭찬 카드 */
  .praise-card {
    background: linear-gradient(135deg, #fff9e6 0%, #fffef0 100%);
    border: 2px solid var(--yellow);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .praise-card::before {
    content: '⭐';
    position: absolute;
    right: 16px; top: 16px;
    font-size: 40px;
    opacity: 0.2;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .card-badge {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .badge-praise {
    background: var(--yellow);
    color: #7a5500;
  }

  .badge-improve {
    background: #dbeafe;
    color: #1e3a8a;
  }

  .badge-tip {
    background: var(--teal-light);
    color: #0f4f47;
  }

  .result-content {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
  }

  /* 보완 카드 */
  .improve-card {
    background: linear-gradient(135deg, #eff6ff 0%, #f8faff 100%);
    border: 2px solid #93c5fd;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .improve-card::before {
    content: '🔍';
    position: absolute;
    right: 16px; top: 16px;
    font-size: 40px;
    opacity: 0.2;
  }

  /* 팁 카드 */
  .tip-card {
    background: var(--teal-light);
    border: 2px solid var(--teal);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .tip-card::before {
    content: '💡';
    position: absolute;
    right: 16px; top: 16px;
    font-size: 40px;
    opacity: 0.2;
  }

  /* 점수 표시 */
  .score-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  .score-item {
    flex: 1;
    background: white;
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
  }

  .score-emoji { font-size: 28px; display: block; margin-bottom: 6px; }
  .score-label { font-size: 11px; color: var(--text-light); font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
  .score-value {
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    color: var(--green);
    display: block;
    margin-top: 4px;
  }

  /* 다시하기 버튼 */
  .btn-retry {
    width: 100%;
    padding: 14px;
    background: white;
    color: var(--green);
    border: 2px solid var(--green);
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Gaegu', cursive;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-retry:hover {
    background: var(--green-light);
    transform: translateY(-1px);
  }

  /* 에러 */
  .error-card {
    background: #fff5f5;
    border: 2px solid #fca5a5;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    font-size: 14px;
    color: #7f1d1d;
    line-height: 1.6;
  }

  /* 버튼 공통 */
  .btn-secondary {
    flex: 1;
    padding: 10px;
    background: var(--bg);
    color: var(--text-mid);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--green); color: var(--green); }

  .btn-primary-sm {
    flex: 1;
    padding: 10px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary-sm:hover { background: #236e3e; }

  /* 하단 안내 */
  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--text-light);
    margin-top: 24px;
    line-height: 1.8;
  }

  .observer-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--green-light);
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 12px;
    margin-top: 8px;
  }

  /* 반응형 */
  @media (max-width: 480px) {
    header h1 { font-size: 24px; }
    .score-row { flex-wrap: wrap; }
    .score-item { min-width: calc(50% - 6px); }
    .container { padding: 16px 12px 60px; }
  }

  /* 타이핑 효과 */
  .typing-cursor::after {
    content: '|';
    animation: blink 0.7s step-end infinite;
    color: var(--green);
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* 토스트 */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text);
    color: white;
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    white-space: nowrap;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <span class="header-emoji">🔬</span>
  <h1>해캄과 짚신벌레, 반가워!</h1>
  <p>활동지 사진을 올리면 AI가 관찰 기록을 함께 살펴봐 줄게요</p>
</header>

<div class="container">

  <!-- 업로드 -->
  <div class="upload-card" id="uploadCard"
       ondragover="handleDragOver(event)"
       ondragleave="handleDragLeave(event)"
       ondrop="handleDrop(event)">
    <label for="fileInput" class="upload-zone" id="uploadZone">
      <span class="upload-icon">📋</span>
      <h2>활동지 사진을 올려줘!</h2>
      <p>현미경으로 관찰한 결과를 적은<br>활동지 사진을 찍어서 올려주세요</p>
      <span class="hint">📸 사진 찍기 · 파일 선택 · 드래그앤드롭 모두 OK!</span>
    </label>
    <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleFileSelect(event)">

    <div class="preview-area" id="previewArea">
      <img id="previewImg" class="preview-img" src="" alt="활동지 미리보기">
      <div class="preview-actions">
        <button class="btn-secondary" onclick="clearImage()">🗑 다시 선택</button>
        <button class="btn-primary-sm" onclick="document.getElementById('fileInput').click()">📸 다른 사진</button>
      </div>
    </div>
  </div>

  <!-- 질문 선택 -->
  <div class="question-section">
    <h3>❓ 어떤 걸 물어볼까?</h3>
    <div class="question-chips" id="questionChips">
      <div class="chip selected" data-q="전체 피드백" onclick="toggleChip(this)">🔍 전체 피드백</div>
      <div class="chip" data-q="빠진 관찰 요소" onclick="toggleChip(this)">📝 빠진 부분 찾기</div>
      <div class="chip" data-q="해캄 집중 분석" onclick="toggleChip(this)">🌿 해캄만</div>
      <div class="chip" data-q="짚신벌레 집중 분석" onclick="toggleChip(this)">🦠 짚신벌레만</div>
      <div class="chip" data-q="관찰 용어 정확성" onclick="toggleChip(this)">📚 용어 맞나요?</div>
      <div class="chip" data-q="더 관찰할 점" onclick="toggleChip(this)">🔭 더 볼 건 없나요?</div>
    </div>
    <div class="custom-question">
      <input type="text" id="customQ" placeholder="직접 질문하기 (예: 해캄 마디가 맞게 관찰됐나요?)">
    </div>
  </div>

  <!-- 분석 버튼 -->
  <button class="btn-analyze" id="analyzeBtn" onclick="analyze()" disabled>
    <span class="btn-icon">🤖</span>
    AI 선생님께 물어보기!
  </button>

  <!-- 로딩 -->
  <div class="loading-area" id="loadingArea">
    <div class="microscope-anim">🔬</div>
    <div class="loading-text">관찰 기록을 살펴보고 있어요...</div>
    <div class="loading-sub">잠깐만 기다려 줘요!</div>
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- 결과 -->
  <div class="result-area" id="resultArea"></div>

</div>

<div class="toast" id="toast"></div>

<script>
  let selectedFile = null;
  let apiKey = 'worker';

  // 초기화
  window.onload = () => {
    updateAnalyzeBtn();
  };

  function saveApiKey() {}

  function handleFileSelect(e) {
    const file = e.target.files[0];
    if (file) loadFile(file);
  }

  function handleDragOver(e) {
    e.preventDefault();
    document.getElementById('uploadCard').classList.add('dragover');
  }

  function handleDragLeave(e) {
    document.getElementById('uploadCard').classList.remove('dragover');
  }

  function handleDrop(e) {
    e.preventDefault();
    document.getElementById('uploadCard').classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadFile(file);
  }

  function loadFile(file) {
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('previewArea').classList.add('show');
      document.getElementById('uploadZone').style.display = 'none';
    };
    reader.readAsDataURL(file);
    updateAnalyzeBtn();
    // 결과 초기화
    document.getElementById('resultArea').className = 'result-area';
    document.getElementById('resultArea').innerHTML = '';
  }

  function clearImage() {
    selectedFile = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('previewArea').classList.remove('show');
    document.getElementById('uploadZone').style.display = 'block';
    updateAnalyzeBtn();
  }

  function toggleChip(el) {
    el.classList.toggle('selected');
  }

  function updateAnalyzeBtn() {
    const btn = document.getElementById('analyzeBtn');
    btn.disabled = !selectedFile;
  }

  function getSelectedQuestions() {
    const chips = document.querySelectorAll('.chip.selected');
    const qs = Array.from(chips).map(c => c.dataset.q);
    const custom = document.getElementById('customQ').value.trim();
    if (custom) qs.push(custom);
    return qs;
  }

  async function analyze() {
    if (!selectedFile) return;

    const questions = getSelectedQuestions();
    const questionText = questions.length > 0
      ? `\n\n특히 다음 사항에 집중해서 피드백해 주세요:\n${questions.map(q => `- ${q}`).join('\n')}`
      : '';

    // UI 전환
    document.getElementById('analyzeBtn').style.display = 'none';
    document.getElementById('loadingArea').classList.add('show');
    document.getElementById('resultArea').className = 'result-area';
    document.getElementById('resultArea').innerHTML = '';

    try {
      // 이미지 → base64
      const base64 = await fileToBase64(selectedFile);
      const mimeType = selectedFile.type || 'image/jpeg';

      const prompt = `당신은 초등학교 4학년 과학 수업에서 학생들의 관찰 활동을 도와주는 친절하고 따뜻한 AI 선생님이에요.

지금 학생이 "해캄과 짚신벌레" 관찰 활동지를 촬영한 사진을 보내왔어요.

반드시 아래 형식을 정확히 지켜서 답변해 주세요. 각 섹션 제목을 그대로 써주세요.

[칭찬]
학생이 관찰 기록에서 잘 기록한 점을 구체적으로 2~3가지 칭찬해 주세요.
이모지를 활용해서 따뜻하고 격려가 되게 써주세요.

[보완]
빠진 관찰 요소나 더 자세히 기록하면 좋을 부분을 2~3가지 알려주세요.
해캄과 짚신벌레의 핵심 특징 기준:
- 해캄: 원통형 세포 연결 구조, 나선형 엽록체, 초록색, 광합성, 사는 곳(호수/강가 바위 근처)
- 짚신벌레: 끝이 둥근 원통 모양, 섬모로 이동, 다른 생물 먹어 양분 얻음, 사는 곳(연못/논)
"틀렸어요"가 아니라 "이것도 보면 더 멋진 탐구가 될 거야" 식으로 격려하며 안내해 주세요.

[탐구제안]
학생이 더 탐구해 볼 수 있는 흥미로운 질문 또는 활동 1가지를 제안해 주세요.

규칙:
- 초등학교 4학년 수준의 쉬운 말 사용
- 이모지 풍부하게 활용
- 한국어로 답변
- [칭찬], [보완], [탐구제안] 태그는 반드시 포함${questionText}

활동지 사진을 보고 실제로 학생이 적은 내용을 바탕으로 구체적으로 피드백해 주세요.`;

      const response = await fetch(
        'https://gemini-proxy.tsjeong917.workers.dev',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-5',
            max_tokens: 2000,
            messages: [
              {
                role: 'user',
                content: [
                  {
                    type: 'image',
                    source: {
                      type: 'base64',
                      media_type: mimeType,
                      data: base64
                    }
                  },
                  {
                    type: 'text',
                    text: prompt
                  }
                ]
              }
            ]
          })
        }
      );

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData?.error?.message || `API 오류 (${response.status})`);
      }

      const data = await response.json();
      console.log('Worker 응답:', JSON.stringify(data).slice(0, 200));
      const text = data?.content?.[0]?.text || '';

      if (!text) {
        const errMsg = data?.error?.message || data?.candidates?.[0]?.finishReason || '응답을 받지 못했어요.';
        throw new Error(errMsg);
      }

      renderResult(text);

    } catch (err) {
      renderError(err.message);
    } finally {
      document.getElementById('loadingArea').classList.remove('show');
      document.getElementById('analyzeBtn').style.display = 'flex';
    }
  }

  function renderResult(text) {
    // 섹션 파싱
    const sections = parseResponse(text);
    
    let html = '';

    // 점수/평가 이모지
    html += `<div class="score-row">
      <div class="score-item">
        <span class="score-emoji">📊</span>
        <div class="score-label">관찰 기록</div>
        <span class="score-value">${sections.praise ? '잘했어요!' : '계속 도전!'}</span>
      </div>
      <div class="score-item">
        <span class="score-emoji">🌟</span>
        <div class="score-label">탐구 자세</div>
        <span class="score-value">훌륭해요!</span>
      </div>
      <div class="score-item">
        <span class="score-emoji">🔬</span>
        <div class="score-label">AI 분석</div>
        <span class="score-value">완료!</span>
      </div>
    </div>`;

    // 칭찬 카드
    if (sections.praise) {
      html += `<div class="praise-card">
        <div class="card-header">
          <span style="font-size:20px">⭐</span>
          <span class="card-badge badge-praise">잘한 점</span>
        </div>
        <div class="result-content">${formatText(sections.praise)}</div>
      </div>`;
    }

    // 보완 카드
    if (sections.improve) {
      html += `<div class="improve-card">
        <div class="card-header">
          <span style="font-size:20px">🔍</span>
          <span class="card-badge badge-improve">더 관찰해 봐요</span>
        </div>
        <div class="result-content">${formatText(sections.improve)}</div>
      </div>`;
    }

    // 다음 탐구 카드
    if (sections.tip) {
      html += `<div class="tip-card">
        <div class="card-header">
          <span style="font-size:20px">💡</span>
          <span class="card-badge badge-tip">다음 탐구 제안</span>
        </div>
        <div class="result-content">${formatText(sections.tip)}</div>
      </div>`;
    }

    // 파싱 안 됐을 때 전체 출력
    if (!sections.praise && !sections.improve && !sections.tip) {
      html += `<div class="praise-card">
        <div class="card-header">
          <span style="font-size:20px">🤖</span>
          <span class="card-badge badge-praise">AI 피드백</span>
        </div>
        <div class="result-content">${formatText(text)}</div>
      </div>`;
    }

    html += `<button class="btn-retry" onclick="retryFeedback()">
      🔄 다른 사진으로 다시 해보기
    </button>`;

    html += `<div class="footer-note">
      💚 열심히 관찰한 네가 자랑스러워요!<br>
      관찰한 내용을 친구들과 함께 이야기해 보세요.
      <br><span class="observer-badge">🔬 원생생물 탐구가 완료됐어요!</span>
    </div>`;

    document.getElementById('resultArea').innerHTML = html;
    document.getElementById('resultArea').classList.add('show');
    document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function parseResponse(text) {
    const sections = { praise: '', improve: '', tip: '' };

    const praiseMatch = text.match(/\[칭찬\]([\s\S]*?)(?=\[보완\]|\[탐구제안\]|$)/);
    const improveMatch = text.match(/\[보완\]([\s\S]*?)(?=\[칭찬\]|\[탐구제안\]|$)/);
    const tipMatch = text.match(/\[탐구제안\]([\s\S]*?)(?=\[칭찬\]|\[보완\]|$)/);

    if (praiseMatch) sections.praise = praiseMatch[1].trim();
    if (improveMatch) sections.improve = improveMatch[1].trim();
    if (tipMatch) sections.tip = tipMatch[1].trim();

    return sections;
  }

  function formatText(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/^[-•]\s+/gm, '✔ ')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>')
      .replace(/^/, '<p>')
      .replace(/$/, '</p>');
  }

  function renderError(message) {
    const html = `
      <div class="error-card">
        <strong>😅 앗, 문제가 생겼어요!</strong><br><br>
        ${message}<br><br>
        <strong>확인해 주세요:</strong><br>
        • API 키가 올바른지 확인해 주세요<br>
        • 인터넷 연결을 확인해 주세요<br>
        • 사진 파일이 너무 크지 않은지 확인해 주세요 (10MB 이하 권장)
      </div>
      <button class="btn-retry" onclick="retryFeedback()">
        🔄 다시 시도해 보기
      </button>`;
    document.getElementById('resultArea').innerHTML = html;
    document.getElementById('resultArea').classList.add('show');
  }

  function retryFeedback() {
    clearImage();
    document.getElementById('resultArea').className = 'result-area';
    document.getElementById('resultArea').innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const base64 = e.target.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
