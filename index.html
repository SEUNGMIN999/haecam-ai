<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해캄과 짚신벌레 관찰 도우미 🔬</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@400;700&display=swap');

  :root {
    --g1: #1B6B3A; --g2: #2E8B57; --g3: #EEF7F2; --g4: #C8E6D4;
    --t1: #0D9488; --t2: #E0F5F3;
    --y1: #F59E0B; --y2: #FFF9E6;
    --bg: #F4F9F6; --surface: #fff;
    --border: #DDE9E3; --border2: #C8D9D1;
    --text: #0F1F17; --text2: #4A6655; --text3: #93B09E;
    --r1: 12px; --r2: 20px; --r3: 28px;
    --sh: 0 2px 16px rgba(27,107,58,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    background: var(--g1);
    padding: 36px 24px 48px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute; top: -60px; right: -60px;
    width: 220px; height: 220px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  header::after {
    content: '';
    position: absolute; bottom: -80px; left: -40px;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .header-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.95);
    font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
    padding: 5px 14px; border-radius: 100px;
    margin-bottom: 14px; position: relative; z-index: 1;
  }
  header h1 {
    font-family: 'Gaegu', cursive;
    font-size: 28px; font-weight: 700;
    color: #fff; letter-spacing: -0.3px;
    margin-bottom: 8px; position: relative; z-index: 1;
  }
  header p { font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.6; position: relative; z-index: 1; }

  .container { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }

  .section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r3);
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: var(--sh);
  }
  .section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700;
    color: var(--text2); letter-spacing: 0.3px;
    margin-bottom: 16px;
  }
  .section-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g1); }

  .upload-zone {
    border: 2px dashed var(--border2);
    border-radius: var(--r2);
    padding: 32px 20px;
    text-align: center;
    transition: all 0.2s;
    cursor: pointer;
  }
  .upload-zone.dragover { border-color: var(--g1); background: var(--g3); }
  .upload-zone:hover { border-color: var(--g2); }

  .upload-emoji-ring {
    width: 64px; height: 64px;
    background: var(--g3);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; margin: 0 auto 16px;
    border: 3px solid var(--g4);
  }
  .upload-zone h2 { font-family: 'Gaegu', cursive; font-size: 22px; color: var(--text); margin-bottom: 6px; }
  .upload-zone p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 20px; }

  .upload-btn-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; }
  .btn-cam {
    flex: 1; max-width: 150px;
    padding: 12px 16px;
    background: var(--g1); color: #fff;
    border: none; border-radius: 14px;
    font-size: 14px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn-cam:hover { opacity: 0.85; }
  .btn-album {
    flex: 1; max-width: 150px;
    padding: 12px 16px;
    background: transparent; color: var(--g1);
    border: 2px solid var(--g1); border-radius: 14px;
    font-size: 14px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-album:hover { background: var(--g3); }
  .hint-chip {
    display: inline-block;
    font-size: 12px; color: var(--text3);
    background: var(--g3);
    padding: 5px 14px; border-radius: 100px;
  }

  input[type="file"] { display: none; }
  .preview-area { display: none; }
  .preview-area.show { display: block; }
  .preview-img {
    width: 100%; max-height: 300px; object-fit: contain;
    border-radius: 16px; border: 1px solid var(--border);
    background: var(--bg);
  }
  .preview-actions { display: flex; gap: 10px; margin-top: 12px; }
  .btn-ghost {
    flex: 1; padding: 10px;
    background: var(--bg); color: var(--text2);
    border: 1px solid var(--border2); border-radius: 12px;
    font-size: 13px; font-family: inherit; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-ghost:hover { border-color: var(--g1); color: var(--g1); }
  .btn-outline {
    flex: 1; padding: 10px;
    background: var(--g3); color: var(--g1);
    border: 1px solid var(--g4); border-radius: 12px;
    font-size: 13px; font-family: inherit; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-outline:hover { background: var(--g4); }

  .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    padding: 8px 15px; border-radius: 100px;
    border: 1.5px solid var(--border2);
    background: var(--bg);
    font-size: 13px; font-family: inherit; font-weight: 500;
    color: var(--text2); cursor: pointer; transition: all 0.15s;
  }
  .chip:hover { border-color: var(--g1); color: var(--g1); }
  .chip.selected { background: var(--g1); border-color: var(--g1); color: #fff; }

  input[type="text"] {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid var(--border2); border-radius: 12px;
    font-size: 13px; font-family: inherit; color: var(--text);
    background: var(--bg); outline: none; transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--g1); background: var(--surface); }

  .btn-analyze {
    width: 100%; padding: 17px;
    background: var(--g1); color: #fff;
    border: none; border-radius: 18px;
    font-family: 'Gaegu', cursive; font-size: 20px;
    cursor: pointer; transition: opacity 0.15s;
    margin-bottom: 24px; letter-spacing: 0.3px;
    box-shadow: 0 4px 18px rgba(27,107,58,0.28);
  }
  .btn-analyze:hover:not(:disabled) { opacity: 0.88; }
  .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  .loading-area {
    display: none; text-align: center;
    padding: 44px 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r3); margin-bottom: 16px;
    box-shadow: var(--sh);
  }
  .loading-area.show { display: block; }
  .loading-emoji { font-size: 44px; display: block; margin-bottom: 14px; animation: bounce 1.2s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .loading-text { font-family: 'Gaegu', cursive; font-size: 20px; color: var(--g1); margin-bottom: 4px; }
  .loading-sub { font-size: 13px; color: var(--text3); }
  .loading-dots { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
  .loading-dots span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--g1);
    animation: dot 1.2s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; background: var(--t1); }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; background: var(--y1); }
  @keyframes dot { 0%,80%,100%{transform:scale(0.6);opacity:0.4} 40%{transform:scale(1.1);opacity:1} }

  .result-area { display: none; animation: fadeUp 0.4s ease-out; }
  .result-area.show { display: block; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  .result-header-card {
    background: var(--g1);
    border-radius: var(--r3);
    padding: 22px;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 14px;
  }
  .result-header-icon { font-size: 40px; }
  .result-header-text h3 { font-family: 'Gaegu', cursive; font-size: 22px; color: #fff; margin-bottom: 2px; }
  .result-header-text p { font-size: 13px; color: rgba(255,255,255,0.75); }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r3);
    padding: 22px;
    margin-bottom: 14px;
    box-shadow: var(--sh);
    position: relative; overflow: hidden;
  }
  .result-card::before {
    content: ''; position: absolute;
    top: 0; left: 0; width: 4px; height: 100%;
    background: var(--g1); border-radius: 0;
  }
  .result-card-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
  }
  .result-card-badge {
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
    padding: 4px 10px; border-radius: 100px;
    background: var(--g3); color: var(--g1);
  }
  .result-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px; line-height: 1.75; color: var(--text);
  }
  .result-item:last-child { border-bottom: none; padding-bottom: 0; }
  .result-num {
    min-width: 28px; height: 28px;
    background: var(--g3); color: var(--g1);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
  }

  .result-content { font-size: 14px; line-height: 1.85; color: var(--text); }
  .result-content p { margin-bottom: 8px; }
  .result-content p:last-child { margin-bottom: 0; }
  .result-content strong { font-weight: 700; color: var(--g1); }

  .error-card {
    background: #FFF5F5; border: 1px solid #FECACA;
    border-radius: var(--r3); padding: 20px;
    margin-bottom: 14px; font-size: 14px; color: #7F1D1D; line-height: 1.7;
  }

  .btn-retry {
    width: 100%; padding: 14px;
    background: var(--surface); color: var(--g1);
    border: 2px solid var(--g1); border-radius: 16px;
    font-size: 15px; font-weight: 700; font-family: 'Gaegu', cursive;
    cursor: pointer; transition: background 0.15s;
    margin-top: 4px;
  }
  .btn-retry:hover { background: var(--g3); }

  .followup-section {
    background: #f0f7f0;
    border-radius: 16px;
    padding: 20px;
    margin-top: 16px;
    border: 2px solid #c8e6c9;
  }
  .followup-title {
    font-size: 18px;
    font-weight: 700;
    color: #2e7d32;
    margin-bottom: 4px;
  }
  .followup-subtitle {
    font-size: 13px;
    color: #666;
    margin-bottom: 14px;
  }
  .followup-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .followup-chip {
    background: #fff;
    border: 1.5px solid #81c784;
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    color: #2e7d32;
    cursor: pointer;
    transition: all 0.2s;
  }
  .followup-chip:hover { background: #e8f5e9; }
  .followup-input-wrap {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .followup-input-wrap input {
    flex: 1;
    border: 1.5px solid #81c784;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  .followup-send-btn {
    background: #388e3c;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 16px;
    cursor: pointer;
  }
  .followup-answer {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-top: 10px;
    border-left: 4px solid #66bb6a;
  }
  .followup-q {
    font-weight: 700;
    color: #2e7d32;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .followup-a {
    font-size: 14px;
    color: #333;
    line-height: 1.6;
  }

  .footer-note {
    text-align: center; font-size: 12px; color: var(--text3);
    margin-top: 20px; line-height: 1.9;
  }
  .footer-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--g3); color: var(--g1);
    font-size: 11px; font-weight: 700;
    padding: 4px 12px; border-radius: 100px; margin-top: 8px;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #111; color: #fff;
    padding: 10px 22px; border-radius: 100px;
    font-size: 13px; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 768px), (orientation: portrait) and (max-width: 1440px) {
    header h1 { font-size: 24px; }
    .container { padding: 20px 12px 60px; }
    .intro-img { content: url('intro-mobile.png'); object-position: top; }
    .intro-start-overlay { top: 75%; }
    .intro-start-btn { font-size: 16px; padding: 10px 28px; }
    .intro-start-hint { font-size: 11px; padding: 4px 12px; }
  }

  /* ── 인트로 화면 ── */
  #introScreen {
    position: fixed; inset: 0;
    background: #d4edda;
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    cursor: pointer;
    transition: opacity 0.5s ease, transform 0.5s ease;
    overflow: hidden;
  }
  #introScreen.fade-out {
    opacity: 0; transform: scale(1.03); pointer-events: none;
  }

  .intro-img-wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }

  .intro-img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  .intro-start-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .intro-start-btn {
    padding: 20px 60px;
    background: #e53935;
    color: #fff;
    border: none;
    border-radius: 100px;
    font-family: 'Gaegu', cursive;
    font-size: 30px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(229,57,53,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }
  .intro-start-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(229,57,53,0.6); }
  .intro-start-btn:active { transform: scale(0.97); }

  .intro-start-hint {
    font-size: 16px;
    color: rgba(255,255,255,0.95);
    background: rgba(0,0,0,0.3);
    padding: 7px 20px;
    border-radius: 100px;
    backdrop-filter: blur(4px);
    animation: blink 2s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes blink { 0%,100%{opacity:0.6} 50%{opacity:1} }
</style>
</head>
<body>

<!-- 인트로 화면 -->
<div id="introScreen" onclick="startApp()">
  <div class="intro-img-wrap">
    <img src="intro.png" alt="해캄과 짚신벌레 반가워" class="intro-img">
    <div class="intro-start-overlay">
      <button class="intro-start-btn" onclick="startApp()">
        🚀 시작하기
      </button>
      <div class="intro-start-hint">화면을 탭해도 시작돼요!</div>
    </div>
  </div>
</div>

<!-- 메인 앱 (처음엔 숨김) -->
<div id="mainApp" style="display:none;">

<header>
  <div class="header-pill">🔬 과학 탐구 도우미</div>
  <h1>해캄과 짚신벌레, 반가워!</h1>
  <p>활동지 사진을 올리면 AI가<br>더 관찰할 부분을 알려줄게요 🌿</p>
</header>

<div class="container">

  <!-- 업로드 -->
  <div class="section-card">
    <div class="section-title"><div class="dot"></div>활동지 사진 올리기</div>
    <div class="upload-zone" id="uploadCard"
         ondragover="handleDragOver(event)"
         ondragleave="handleDragLeave(event)"
         ondrop="handleDrop(event)">

      <div id="uploadZone">
        <div class="upload-emoji-ring">📋</div>
        <h2>사진을 올려줘!</h2>
        <p>현미경으로 관찰한 결과를 적은<br>활동지 사진을 찍어서 올려주세요</p>
        <div class="upload-btn-row">
          <button class="btn-cam" onclick="document.getElementById('cameraInput').click()">📸 사진 찍기</button>
          <button class="btn-album" onclick="document.getElementById('albumInput').click()">🖼 앨범 선택</button>
        </div>
        <div class="hint-chip">💻 PC에서는 파일을 여기로 끌어다 놓아도 돼요!</div>
      </div>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleFileSelect(event)">
      <input type="file" id="albumInput" accept="image/*" onchange="handleFileSelect(event)">

      <div class="preview-area" id="previewArea">
        <img id="previewImg" class="preview-img" src="" alt="활동지 미리보기">
        <div class="preview-actions">
          <button class="btn-ghost" onclick="clearImage()">🗑 다시 선택</button>
          <button class="btn-outline" onclick="document.getElementById('albumInput').click()">🖼 다른 사진</button>
        </div>
      </div>
    </div>
  </div>



  <!-- 질문 선택 -->
  <div class="section-card">
    <input type="text" id="customQ" placeholder="직접 질문하기 (예: 더 자세하게 관찰할 부분은 무엇일까?)">
  </div>

  <!-- 분석 버튼 -->
  <button class="btn-analyze" id="analyzeBtn" onclick="analyze()" disabled>
    🤖 AI 선생님께 물어보기!
  </button>

  <!-- 로딩 -->
  <div class="loading-area" id="loadingArea">
    <span class="loading-emoji">🔬</span>
    <div class="loading-text">관찰 기록을 살펴보고 있어요...</div>
    <div class="loading-sub">잠깐만 기다려 줘요!</div>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>

  <!-- 결과 -->
  <div class="result-area" id="resultArea"></div>

</div>

<div class="toast" id="toast"></div>

</div><!-- end mainApp -->

<script>
  let selectedFile = null;
  let apiKey = 'worker';

  // 모바일 감지해서 버튼 크기 조절
  function adjustIntroForMobile() {
    const isMobile = window.innerWidth < window.innerHeight; // 세로 모드
    const btn = document.querySelector('.intro-start-btn');
    const hint = document.querySelector('.intro-start-hint');
    const overlay = document.querySelector('.intro-start-overlay');
    if (isMobile) {
      btn.style.fontSize = '16px';
      btn.style.padding = '10px 28px';
      hint.style.fontSize = '11px';
      overlay.style.top = '75%';
    } else {
      btn.style.fontSize = '';
      btn.style.padding = '';
      hint.style.fontSize = '';
      overlay.style.top = '';
    }
  }
  window.addEventListener('load', adjustIntroForMobile);
  window.addEventListener('resize', adjustIntroForMobile);

  function startApp() {
    const intro = document.getElementById('introScreen');
    const main = document.getElementById('mainApp');
    intro.classList.add('fade-out');
    setTimeout(() => {
      intro.style.display = 'none';
      main.style.display = 'block';
    }, 480);
  }

  // 초기화
  window.onload = () => {
    updateAnalyzeBtn();
  };

  function saveApiKey() {}

  function handleFileSelect(e) {
    const file = e.target.files[0];
    if (file) loadFile(file);
  }

  function handleDragOver(e) {
    e.preventDefault();
    document.getElementById('uploadCard').classList.add('dragover');
  }

  function handleDragLeave(e) {
    document.getElementById('uploadCard').classList.remove('dragover');
  }

  function handleDrop(e) {
    e.preventDefault();
    document.getElementById('uploadCard').classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadFile(file);
  }

  function loadFile(file) {
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('previewArea').classList.add('show');
      document.getElementById('uploadZone').style.display = 'none';
    };
    reader.readAsDataURL(file);
    updateAnalyzeBtn();
    // 결과 초기화
    document.getElementById('resultArea').className = 'result-area';
    document.getElementById('resultArea').innerHTML = '';
  }

  function clearImage() {
    selectedFile = null;

      .replace(/^[-•]\s+/gm, '✔ ')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>')
      .replace(/^/, '<p>')
      .replace(/$/, '</p>');
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataURL = canvas.toDataURL('image/jpeg', 0.75);
        resolve(dataURL.split(',')[1]);
      };
      img.onerror = reject;
      img.src = url;
    });
  }
